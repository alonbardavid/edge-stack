name: Preview Teardown

on:
  delete:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  delete-on-branch-delete:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve Cloudflare account
        id: cf
        uses: ./.github/actions/cloudflare-env
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute preview D1 name
        id: names
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.ref }}"
          SANITIZED=$(printf '%s' "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-//; s/-$//' \
            | cut -c1-40 \
            | sed 's/-$//')
          HASH=$(printf '%s' "$BRANCH" | sha1sum | cut -c1-6)
          DB_NAME="project-name-preview-${SANITIZED}-${HASH}"
          echo "db_name=$DB_NAME" >> "$GITHUB_OUTPUT"

      - name: Delete preview D1
        continue-on-error: true
        run: pnpm --filter @app/backend exec wrangler d1 delete "${{ steps.names.outputs.db_name }}" --skip-confirmation

  prune-orphans:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve Cloudflare account
        id: cf
        uses: ./.github/actions/cloudflare-env
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build active preview D1 names from live branches
        run: |
          set -euo pipefail
          : > /tmp/active.txt
          gh api -X GET "repos/${{ github.repository }}/branches?per_page=100" --paginate --jq '.[].name' \
            | while read -r B; do
                [ -z "$B" ] && continue
                [ "$B" = "main" ] && continue
                SAN=$(printf '%s' "$B" \
                  | tr '[:upper:]' '[:lower:]' \
                  | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-//; s/-$//' \
                  | cut -c1-40 \
                  | sed 's/-$//')
                HASH=$(printf '%s' "$B" | sha1sum | cut -c1-6)
                echo "project-name-preview-${SAN}-${HASH}" >> /tmp/active.txt
              done

      - name: Prune orphan preview D1s
        run: |
          set -euo pipefail
          PREVIEW_DBS=$(pnpm --silent --filter @app/backend exec wrangler d1 list --json \
            | jq -r '.[] | select(.name | startswith("project-name-preview-")) | .name')
          for DB in $PREVIEW_DBS; do
            if grep -qx "$DB" /tmp/active.txt; then
              continue
            fi
            echo "Pruning orphan: $DB"
            pnpm --filter @app/backend exec wrangler d1 delete "$DB" --skip-confirmation || true
          done
